{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}회원가입{% endblock title%}

{% block content %}
  <div class="container">
    <h2 class="mt-3">회원가입</h2>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-success" type="submit">회원가입</button>
    </form>
  </div>
{% endblock content %}
