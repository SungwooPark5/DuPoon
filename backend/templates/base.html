<!DOCTYPE html>
<html lang="ko">
  {% load static %}

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple Quant Trading Platform">
    <meta name="keywords" content="Quant, Trading, Platform">
    <meta name="author" content="SWPark">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Du Poon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>

  <body>
    <main>
      {% block content %}{% endblock content %}
    </main>
    <footer>
      <p>© 2025 SWPark</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="{% static 'js/common.js' %}"></script>
    {% if request.user.is_authenticated %}
      <script>
        const userId = '{{ request.user.id }}';
        const socket = new WebSocket(`ws://${window.location.host}/ws/price-update/${userId}/`);

        socket.onmessage = function (event) {
          const data = JSON.parse(event.data);
          alert(data.message);
        };
      </script>
    {% endif %}
    {% block script %}{% endblock script %}
  </body>

</html>
