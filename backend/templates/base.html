<!DOCTYPE html>
<html lang="ko">
  {% load static %}

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple Quant Trading Platform">
    <meta name="keywords" content="Quant, Trading, Platform">
    <meta name="author" content="SWPark">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Du Poon</title>
  </head>

  <body>
    {% block content %}{% endblock content %}
    <footer>
      <p>© 2025 SWPark</p>
    </footer>
  </body>
  <script src="{% static 'js/common.js' %}"></script>
  {% if request.user.is_authenticated %}
    <script>
      const userId = '{{ request.user.id }}';
      const socket = new WebSocket(`ws://${window.location.host}/ws/price-update/${userId}/`);

      socket.onmessage = function (event) {
        const data = JSON.parse(event.data);
        alert(data.message);
      };
    </script>
  {% endif %}
  {% block script %}{% endblock script %}

</html>
