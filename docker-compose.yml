services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: "python manage.py runserver 0.0.0.0:8000"
    # 개발 환경에서는 websockt이 필요한 경우를 제외하고는 runserver를 사용
    # command: >
    #   sh -c "python manage.py collectstatic --noinput &&
    #   uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/code
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: "celery -A config worker --loglevel=info"
    depends_on:
      - redis
    volumes:
      - ./backend:/code
    env_file:
      - .env

volumes:
  postgres_data:
